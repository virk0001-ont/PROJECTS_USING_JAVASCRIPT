<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>VoiceNotes AI</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet" />

    <!-- CSS FILE -->
    <link rel="stylesheet"
          href="VB.css" />
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>🎙️ VoiceNotes AI</h1>

        <p>
            Record • Transcribe • Generate Notes
        </p>

    </header>


    <!-- MAIN CONTAINER -->

    <main class="container">

        <!-- RECORD SECTION -->

        <section class="card">

            <h2>Recorder</h2>

            <div id="status">
                Ready to Record
            </div>

            <div id="timer">
                00:00
            </div>

            <button id="recordBtn">
                Start Recording
            </button>

        </section>



        <!-- RECORDINGS -->

        <section class="card">

            <h2>Saved Recordings</h2>

            <div id="recordingsContainer">

            </div>

        </section>



        <!-- NOTES -->

        <section class="card">

            <h2>AI Notes</h2>

            <button id="generateBtn">
                Generate Notes
            </button>

            <div id="notesContainer">

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT FILE -->

    <script src="VB.js"></script>

</body>

</html>
